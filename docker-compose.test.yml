version: '3.8'

services:
  # Ubuntu 18.04 testing environment
  ubuntu18-test:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu18
    container_name: lemptool-ubuntu18-test
    privileged: true
    volumes:
      - .:/opt/native-lemp-tool
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    command: tail -f /dev/null
    networks:
      - lemptool-test

  # Ubuntu 20.04 testing environment  
  ubuntu20-test:
